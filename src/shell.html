<html lang="en" class="sb-start"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1217"><meta name="description" content="TIDELINE with BootKit startup checks, local error reports, fullscreen game mode, and orientation-aware touch controls."><title>TIDELINE · Surface lab</title><style>/* BootKit 1.0: all styles are scoped; no fonts, images, or external assets. */
html.sb-start,html.sb-failed{background:#0d1217!important}html.sb-start body,html.sb-failed body{margin:0;background:#0d1217!important;overflow:hidden}#sb-root[hidden],#sb-mode[hidden],#sb-report[hidden]{display:none!important}

#sb-mode,#sb-report{background:#0d1217f5;z-index:2147483601}#sb-report{z-index:2147483602}#sb-report textarea{display:block;width:100%;height:44vh;font:11px/1.5 monospace;background:#0c1319;color:#d9e4e9;border:1px solid #526876;padding:12px;margin:12px 0;resize:vertical;user-select:text;touch-action:pan-y;white-space:pre-wrap;overflow-wrap:anywhere}#sb-mode .sb-close,#sb-report .sb-close{margin-left:auto}#sb-optionalList{white-space:pre-wrap;overflow-wrap:anywhere}.sb-noscript{padding:20px;background:#321c20;color:#ffe2d8}
html.sb-start #world,html.sb-start #marks{visibility:hidden!important}html.sb-start #touchApp,html.sb-start .topbar,html.sb-start #labToolbar{visibility:hidden!important}
html.sb-game-focus,html.sb-game-focus body{overscroll-behavior:none!important}html.sb-game-focus #world{touch-action:none!important;-webkit-touch-callout:none;user-select:none}html.sb-game-focus #touchApp{overscroll-behavior:none}html.sb-game-focus #touchApp .m-sheetBody,html.sb-game-focus #touchApp .m-results{overscroll-behavior:contain}html.sb-failed #touchApp,html.sb-failed #world{pointer-events:none!important}
@media(max-width:600px){#sb-root,#sb-mode,#sb-report{padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));font-size:12px}#sb-root .sb-card,#sb-mode .sb-card,#sb-report .sb-card{margin:0 auto;padding:18px 16px}#sb-root h1,#sb-mode h1,#sb-report h1{font-size:23px}.sb-facts{grid-template-columns:78px 1fr;font-size:11px;gap:4px 10px;padding:12px 0;margin:12px 0}.sb-top{margin-bottom:12px}.sb-log{max-height:120px;font-size:10px}.sb-log li{grid-template-columns:49px 1fr 50px;gap:6px}.sb-actions{gap:7px}.sb-actions button{flex:1;padding:11px 9px!important}.sb-actions.sb-launch{display:grid;grid-template-columns:1fr}#sb-root p{font-size:11px}.sb-options{gap:9px}#sb-stage{font-size:13px}.sb-badge{font-size:10px}.sb-over{font-size:10px;letter-spacing:1px}}
@media(orientation:landscape) and (max-height:550px){#sb-root .sb-card{max-width:980px;margin:0 auto;padding:16px 22px;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}#sb-header,#sb-statusBlock,#sb-ready,#sb-failure,#sb-previous,#sb-actionFooter{grid-column:1/-1}#sb-root .sb-facts{margin:9px 0}.sb-log{max-height:115px;margin-top:12px}#sb-ready{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}#sb-ready>p,#sb-ready .sb-options{grid-column:1}#sb-ready .sb-actions{grid-column:2;grid-row:1/4;align-content:center;margin:0}.sb-ready-box{padding-top:9px}#sb-statusBlock progress{margin-top:5px}.sb-actions.sb-launch{display:flex}#sb-root h1{font-size:22px}.sb-top{margin-bottom:5px}}
